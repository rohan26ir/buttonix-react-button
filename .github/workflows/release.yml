# .github/workflows/release.yml
# Release workflow — triggered by pushing a semver tag (e.g. v2.0.0).
# Uses npm Trusted Publishing via OIDC (no long-lived NPM_TOKEN secrets).
# Generates a signed SLSA provenance attestation with --provenance.

name: Release & Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"      # e.g. v2.0.0
      - "v[0-9]+.[0-9]+.[0-9]+-*"    # e.g. v2.0.0-rc.1

# Least-privilege defaults
permissions:
  contents: read

jobs:
  # ─── Pre-release validation ─────────────────────────────────────────────
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Verify package.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error:: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "✓ Versions match: $PKG_VERSION"

  # ─── Build ───────────────────────────────────────────────────────────────
  build:
    name: Build package
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Pack tarball
        run: npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: npm-package
          path: "*.tgz"
          retention-days: 7

      - name: Upload dist
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─── GitHub Release ──────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download tarball
        uses: actions/download-artifact@fa0a91b85d4f404e444306234704c0d9f26b4660 # v4.1.8
        with:
          name: npm-package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2.0.9
        with:
          generate_release_notes: true
          files: "*.tgz"

  # ─── npm Publish (OIDC / Trusted Publishing) ─────────────────────────────
  publish-npm:
    name: Publish to npm (OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish   # Environment must be configured in repo settings with npm Trusted Publishing
    permissions:
      contents: read
      id-token: write  # Required for OIDC token exchange with npm registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js with npm registry
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          # Point to the official npm registry for OIDC publishing
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build package
        run: npm run build

      - name: Publish to npm with provenance
        # --provenance generates a signed SLSA attestation linked to this workflow run.
        # Requires npm >=9.5.0 and the OIDC-based "Automated publishing" granular token
        # configured at https://www.npmjs.com/settings/<user>/tokens (Trusted Publishing).
        # No NPM_TOKEN secret is stored; authentication is via OIDC id-token.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # NPM_TOKEN here is a fallback for repos that haven't configured OIDC yet.
          # Once Trusted Publishing is set up on npmjs.com, this can be removed
          # and npm will authenticate purely via the id-token above.

